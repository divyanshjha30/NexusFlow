# NexusFlow local dev infrastructure.
# Runs on dj-pc (Windows 11 home server). Spring Boot + React run on the Mac.
# floci emulators are started separately via the floci CLI.
#
# Deployed to:  D:\nexusflow\docker\
# Start:        docker compose -f docker-compose.dev.yml up -d
# With Ollama:  docker compose -f docker-compose.dev.yml --profile ai up -d

services:
  # ──────────────────────────────
  # Kafka
  # ──────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: nexusflow-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexusflow-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      # Advertised as dj-pc so the Mac's Spring Boot client is redirected to a
      # hostname it can actually reach. localhost here would break remote clients.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://dj-pc:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:29092",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nexusflow-kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: nexusflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexusflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      create() { kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic $$1 --partitions $$2 --replication-factor 1; }
      create nexusflow.file.uploaded 12
      create nexusflow.file.stored 12
      create nexusflow.file.stored.failed 4
      create nexusflow.ai.started 8
      create nexusflow.ai.step.complete 8
      create nexusflow.ai.complete 12
      create nexusflow.ai.failed 4
      create nexusflow.document.archived 4
      create nexusflow.document.deleted 4
      create nexusflow.audit.log 12
      create nexusflow.user.activity 12
      create nexusflow.dlq 4
      echo '--- topics created ---'
      kafka-topics --list --bootstrap-server kafka:29092
      "
    restart: "no"

  # ──────────────────────────────
  # CockroachDB
  # ──────────────────────────────
  cockroachdb:
    image: cockroachdb/cockroach:v25.3.0
    container_name: nexusflow-cockroachdb
    restart: always
    command: start-single-node --insecure --advertise-addr=cockroachdb
    ports:
      - "26257:26257" # SQL (JDBC)
      - "8080:8080" # CockroachDB admin UI
    volumes:
      - cockroachdb-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--execute=SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  cockroachdb-init:
    image: cockroachdb/cockroach:v25.3.0
    container_name: nexusflow-db-init
    depends_on:
      cockroachdb:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # CockroachDB has VECTOR built in; there is no pgvector extension to create.
    command: |
      "
      cockroach sql --insecure --host=cockroachdb:26257 -e 'CREATE DATABASE IF NOT EXISTS nexusflow;'
      cockroach sql --insecure --host=cockroachdb:26257 -d nexusflow -e 'SELECT version();'
      echo '--- database ready ---'
      "
    restart: "no"

  # ──────────────────────────────
  # Redis
  # ──────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: nexusflow-redis
    restart: always
    command: redis-server --appendonly yes --requirepass nexusflow-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "nexusflow-dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-ui:
    image: redis/redisinsight:latest
    container_name: nexusflow-redis-ui
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data

  # ──────────────────────────────
  # Ollama — profile "ai", not started by default (needed from Milestone 6)
  # ──────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: nexusflow-ollama
    restart: always
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  cockroachdb-data:
  redis-data:
  redisinsight-data:
  ollama-models:
